# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# See: https://nikitabobko.github.io/AeroSpace/guide#config-version
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    'exec-and-forget borders active_color=0xff4191fa inactive_color=0xff494d64 width=8.0',
    # SketchyBar itself runs as a brew service (`brew services start sketchybar`).
    # Only ask the running instance to reload, so workspace items are rebuilt
    # against the AeroSpace instance that just started.
    'exec-and-forget /bin/bash -c "PATH=/opt/homebrew/bin:/usr/local/bin:$PATH sketchybar --reload"',
]

# Start AeroSpace at login
start-at-login = true

# Automatically reload the config when the config file is saved
# After setting this to true, reload once manually to start the auto-reloading
auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config option is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
#
# Deliberately empty. SketchyBar creates its workspace pills per *monitor* and
# labels each from whichever workspace is visible there, so it does not need any
# workspace to exist ahead of time. Naming workspaces here would only pin a
# machine-specific set into a config meant to be portable.
persistent-workspaces = []

# Tell SketchyBar to redraw the workspace list whenever the focused workspace
# changes. See ~/.config/sketchybar/items/workspace.sh for the subscriber.
exec-on-workspace-change = [
    '/bin/bash', '-c',
    'PATH=/opt/homebrew/bin:/usr/local/bin:$PATH sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE',
]

# Redraw when focus moves between windows too, so the highlighted window item
# keeps up with alt-h / alt-j / alt-k / alt-l.
#
# AEROSPACE_WINDOW_ID is the newly focused window, so passing it along saves the
# plugin an `aerospace list-windows --focused` round trip (~20ms) on the most
# frequent event of all.
#
# Note the shape: unlike exec-on-workspace-change, this key takes AeroSpace
# *commands*, so the ['/bin/bash', '-c', ...] array form is rejected here. It has
# to be exec-and-forget, and the shell is needed because exec-and-forget does not
# expand variables itself.
on-focus-changed = [
    'exec-and-forget /bin/bash -c "PATH=/opt/homebrew/bin:/usr/local/bin:$PATH sketchybar --trigger aerospace_focus_change FOCUSED_WINDOW_ID=$AEROSPACE_WINDOW_ID"',
]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
# Mirrors what AeroSpace's own menu bar icon does — shows "(S)" while in
# service mode — on the SketchyBar workspace pill. The callback carries no
# payload, so the plugin reads `aerospace list-modes --current` itself.
on-mode-changed = [
    'exec-and-forget /bin/bash -c "PATH=/opt/homebrew/bin:/usr/local/bin:$PATH sketchybar --trigger aerospace_mode_change"',
]

focus-follows-mouse.enabled = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
gaps.inner.horizontal = 8
gaps.inner.vertical =   0
gaps.outer.left =       4
gaps.outer.bottom =     4
# The top gap has to be per-monitor because only some displays reserve space at
# the top themselves. Measured via NSScreen frame vs visibleFrame:
#
#   Built-in Retina  frame h=982  visibleFrame h=950  -> 32pt already reserved
#   PHL 272E2F       frame h=1080 visibleFrame h=1080 -> 0pt reserved
#
# The built-in has a notch, so macOS keeps a 32pt safe area that AeroSpace
# already excludes, and SketchyBar draws its 32pt bar inside exactly that strip.
# It therefore needs the plain gap only. The external display reserves nothing
# (the macOS menu bar is set to auto-hide, _HIHideMenuBar = 1), so there the gap
# must also cover the bar: 32 (bar height) + 4.
#
# A flat value cannot satisfy both — 36 everywhere leaves the built-in with
# 32 + 36 = 68pt of dead space above the topmost window.
#
# Re-measure with:
#   osascript -l JavaScript -e 'ObjC.import("AppKit"); var s=$.NSScreen.screens;
#     var o=[]; for (var i=0;i<s.count;i++){var c=s.objectAtIndex(i);
#     o.push(ObjC.unwrap(c.localizedName)+" "+JSON.stringify(
#     [ObjC.deepUnwrap(c.frame),ObjC.deepUnwrap(c.visibleFrame)]));} o.join("\n")'
gaps.outer.top = [{ monitor."built-in" = 4 }, 36]
gaps.outer.right =      4

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-enter = '''exec-and-forget osascript -e \
    # 'tell application "Terminal" to tell (do script) to activate' '''

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # See: https://nikitabobko.github.io/AeroSpace/commands#fullscreen
    alt-f = 'fullscreen'

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Switch "tabs" — focus the Nth window of the focused workspace, matching the
    # left-to-right order of the window icons in SketchyBar. alt-0 is the 10th,
    # which is MAX_WINDOW_SLOTS in the SketchyBar config.
    #
    # AeroSpace has no native focus-by-position command, hence the helper script.
    # `bash -c` is needed because exec-and-forget does not expand $HOME.
    alt-1 = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/focus-window.sh 1"'
    alt-2 = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/focus-window.sh 2"'
    alt-3 = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/focus-window.sh 3"'
    alt-4 = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/focus-window.sh 4"'
    alt-5 = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/focus-window.sh 5"'
    alt-6 = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/focus-window.sh 6"'
    alt-7 = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/focus-window.sh 7"'
    alt-8 = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/focus-window.sh 8"'
    alt-9 = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/focus-window.sh 9"'
    alt-0 = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/focus-window.sh 10"'

    # Workspaces are reached by cycling with alt-tab, below — there are no
    # per-workspace bindings, so nothing here names a workspace or assumes how
    # many exist.
    # Cycle *every* workspace, cmd-tab style: each press advances a highlight
    # through the ring and the last wraps to the first. The circle spans both
    # monitors. Crucially the workspace does NOT change on each press — the switch
    # is committed only when alt is released, so intermediate workspaces never
    # flash up on the way to the one you want.
    #
    # Two halves make that work. This binding runs switch-workspace.sh, which only
    # moves the highlight and repaints SketchyBar's switcher HUD. The commit — the
    # actual `aerospace workspace` — is run by commit-workspace.sh, fired by a
    # small launchd helper (aerospace/helper) that watches for Option being
    # released, since neither AeroSpace nor SketchyBar can observe a key release.
    # If that helper is not installed, alt-tab still highlights but never commits;
    # see aerospace/helper/README.md.
    #
    # `bash -c` is needed because exec-and-forget does not expand $HOME.
    #
    # Focus lands on the workspace's own screen rather than the workspace being
    # dragged onto the focused one — see the git history for why pulling it over
    # was tried and dropped.
    #
    # Unlike cmd-tab this is positional, not most-recently-used: the ring is a
    # fixed alphabetical order, not a recent-use stack.
    #
    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-tab = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/switch-workspace.sh"'
    # alt-shift-tab: cycle the focused workspace's windows, exactly like alt-tab
    # cycles workspaces. Each press moves the highlight among the window pills
    # without changing focus; the switch commits when Option is released, via the
    # same alt-release helper (see the alt-tab note above and aerospace/helper).
    # With zero or one window in the workspace it does nothing.
    alt-shift-tab = 'exec-and-forget /bin/bash -c "$HOME/.config/aerospace/scripts/switch-window.sh"'

    # Reload SketchyBar (picks up config edits without restarting the service).
    # Disabled: kept for reference, re-enable by uncommenting.
    # alt-shift-r = 'exec-and-forget /bin/bash -c "PATH=/opt/homebrew/bin:/usr/local/bin:$PATH sketchybar --reload"'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']


# ==============================================================================
# Always-floating applications
# ==============================================================================
#
# Apps whose windows should never be tiled: settings panes, one-shot utilities
# and dialog-shaped windows that look wrong stretched to half the screen.
#
# These run when AeroSpace *detects* a window — every new window, plus existing
# windows at AeroSpace startup. See:
# https://nikitabobko.github.io/AeroSpace/guide#on-window-detected-callback
#
# To add an app, copy a block and change the id. Find an id by opening a window
# of the app and running:
#
#   aerospace list-windows --all --format '%{app-bundle-id}|%{app-name}'
#
# or, without opening it:
#
#   osascript -e 'id of app "App Name"'
#
# `if.app-id` is an exact match, not a pattern — a typo silently does nothing
# rather than erroring, so verify the id rather than guessing it. Use
# `if.app-name-regex-substring` instead if you want one block to cover several
# apps, at the cost of matching on a localizable display name.
#
# Only the FIRST matching block runs. Add `check-further-callbacks = true` to a
# block if later blocks should also apply to the same window.
#
# To float something case by case instead, the service mode already has it:
# alt-shift-; then f toggles the focused window between floating and tiling.

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences' # System Settings
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator' # Calculator
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor' # Activity Monitor
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.DiskUtility' # Disk Utility
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.SystemProfiler' # System Information
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Console' # Console
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder' # Finder
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.AppStore' # App Store
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.iCal' # Calendar
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ScreenContinuity' # iPhone Mirroring
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.1password.1password' # 1Password
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.cisco.secureclient.gui' # Cisco Secure Client
run = 'layout floating'
